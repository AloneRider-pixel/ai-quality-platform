global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'

  - job_name: 'mock-api'
    static_configs:
      - targets: ['host.docker.internal:9000']
    metrics_path: '/metrics'

  - job_name: 'pytest-metrics'
    static_configs:
      - targets: ['host.docker.internal:9100']
    metrics_path: '/metrics'
