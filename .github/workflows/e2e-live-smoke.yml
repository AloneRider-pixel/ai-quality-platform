name: E2E live smoke (read-only, opt-in)

# READ-ONLY checks against the public demo deployments. This whole workflow
# is inert until the owner approves watching the live demos and sets the
# E2E_LIVE_SMOKE_ENABLED repository variable to 'true'. It performs page
# loads and GETs only: no logins, no forms, no writes. Free-tier cold starts
# are waited out and reported, never hidden.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  live-smoke:
    name: Read-only live demo smoke
    if: vars.E2E_LIVE_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run read-only live smoke
        env:
          E2E_LIVE: '1'
        run: |
          pytest tests/e2e/live -m live -v \
            --html=reports/live_smoke_report.html --self-contained-html \
            --junitxml=reports/live_smoke_junit.xml \
            --screenshot only-on-failure --output reports/e2e-artifacts
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-smoke-report
          path: reports/
          if-no-files-found: ignore
