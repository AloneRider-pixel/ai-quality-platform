name: AI Quality CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run smoke tests against mock API
        run: |
          python -m uvicorn mocks.mock_api:app --host 127.0.0.1 --port 8000 > /tmp/mock-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              pytest tests/ -m smoke -v --tb=short
              exit $?
            fi
            sleep 1
          done
          cat /tmp/mock-api.log
          exit 1
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: reports/
          if-no-files-found: ignore

  api-tests:
    name: API tests
    needs: smoke-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run API tests against mock API
        run: |
          python -m uvicorn mocks.mock_api:app --host 127.0.0.1 --port 8000 > /tmp/mock-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              pytest tests/api/ -v --html=reports/api_report.html --self-contained-html --junitxml=reports/api_junit.xml
              exit $?
            fi
            sleep 1
          done
          cat /tmp/mock-api.log
          exit 1
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-report
          path: reports/
          if-no-files-found: ignore

  llm-tests:
    name: LLM quality tests
    needs: smoke-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run LLM tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest tests/llm/ -v --html=reports/llm_report.html --self-contained-html --junitxml=reports/llm_junit.xml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llm-test-report
          path: reports/
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests
    needs: [api-tests, llm-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run integration tests against mock API
        run: |
          python -m uvicorn mocks.mock_api:app --host 127.0.0.1 --port 8000 > /tmp/mock-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              pytest tests/integration/ -v --html=reports/integration_report.html --self-contained-html
              exit $?
            fi
            sleep 1
          done
          cat /tmp/mock-api.log
          exit 1

  load-tests:
    name: Load tests
    needs: integration-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run load test against mock API
        run: |
          python -m uvicorn mocks.mock_api:app --host 127.0.0.1 --port 8000 > /tmp/mock-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              locust -f tests/performance/locustfile.py --headless -u 50 -r 5 -t 30s --host http://127.0.0.1:8000 --csv=reports/load_test
              exit $?
            fi
            sleep 1
          done
          cat /tmp/mock-api.log
          exit 1

  quality-gate:
    name: Quality gate
    needs: [api-tests, llm-tests, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if required test stage failed
        if: needs.api-tests.result != 'success' || needs.llm-tests.result != 'success' || needs.integration-tests.result != 'success'
        run: exit 1
      - run: echo 'All required quality stages passed.'
