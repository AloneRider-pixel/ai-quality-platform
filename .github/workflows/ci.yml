name: AI Quality CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ai-quality-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run smoke tests against mock API
        run: |
          python -m uvicorn mocks.mock_api:app --host 127.0.0.1 --port 8000 > /tmp/mock-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              pytest tests/ -m smoke -v --tb=short
              exit $?
            fi
            sleep 1
          done
          cat /tmp/mock-api.log
          exit 1
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report
          path: reports/
          if-no-files-found: ignore

  api-tests:
    name: API tests
    needs: smoke-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run API tests against mock API
        run: |
          python -m uvicorn mocks.mock_api:app --host 127.0.0.1 --port 8000 > /tmp/mock-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              pytest tests/api/ -v --html=reports/api_report.html --self-contained-html --junitxml=reports/api_junit.xml
              exit $?
            fi
            sleep 1
          done
          cat /tmp/mock-api.log
          exit 1
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-report
          path: reports/
          if-no-files-found: ignore

  llm-tests:
    name: LLM quality regression (deterministic fixtures)
    needs: smoke-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify deterministic evaluation manifest
        run: python -m json.tool docs/deterministic-evaluation.json >/dev/null
      - name: Run deterministic LLM fixture tests
        run: pytest tests/llm/ -v --html=reports/llm_report.html --self-contained-html --junitxml=reports/llm_junit.xml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llm-test-report
          path: reports/
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests
    needs: [api-tests, llm-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run integration tests against mock API
        run: |
          python -m uvicorn mocks.mock_api:app --host 127.0.0.1 --port 8000 > /tmp/mock-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              pytest tests/integration/ -v --html=reports/integration_report.html --self-contained-html
              exit $?
            fi
            sleep 1
          done
          cat /tmp/mock-api.log
          exit 1

  load-tests:
    name: Load tests
    needs: integration-tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run load test against mock API
        run: |
          python -m uvicorn mocks.mock_api:app --host 127.0.0.1 --port 8000 > /tmp/mock-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              locust -f tests/performance/locustfile.py --headless -u 50 -r 5 -t 30s --host http://127.0.0.1:8000 --csv=reports/load_test
              exit $?
            fi
            sleep 1
          done
          cat /tmp/mock-api.log
          exit 1

  e2e-tests:
    name: Browser E2E tests (local targets)
    needs: smoke-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out fraud-detection-engine (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AloneRider-pixel/fraud-detection-engine
          ref: f7c22db3b38ea4b4b9aea89c478a0602146e1328
          path: .e2e-targets/fraud
      - name: Check out learning-path-lab (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AloneRider-pixel/learning-path-lab-yottaflex
          ref: fa06ae0b6e70a4899f51940b7251e678063eb550
          path: .e2e-targets/lpl
      - name: Check out stocksense-ai (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AloneRider-pixel/stocksense-ai
          ref: 8d4faef5a69dbbed7e5e3f1d7ea573b35503d3df
          path: .e2e-targets/stocksense
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install platform dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Playwright Chromium (pinned browser build)
        run: python -m playwright install --with-deps chromium
      - name: Install target-app dependencies
        run: |
          python -m pip install -r .e2e-targets/fraud/requirements-dev.txt
          python -m pip install -r .e2e-targets/stocksense/requirements.txt
      - name: Run browser E2E tests against locally started apps
        run: |
          pytest tests/e2e -m "e2e and not live" -v \
            --html=reports/e2e_report.html --self-contained-html \
            --junitxml=reports/e2e_junit.xml \
            --screenshot only-on-failure --output reports/e2e-artifacts
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-report
          path: reports/
          if-no-files-found: ignore

  quality-gate:
    name: Quality gate
    needs: [api-tests, llm-tests, integration-tests, load-tests, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if required test stage failed
        if: needs.api-tests.result != 'success' || needs.llm-tests.result != 'success' || needs.integration-tests.result != 'success' || needs.load-tests.result != 'success' || needs.e2e-tests.result != 'success'
        run: exit 1
      - run: echo 'All required quality stages passed.'
