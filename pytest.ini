[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html
markers =
    api: API test
    integration: Integration test
    llm: LLM/AI quality test
    ui: UI automation test
    contract: Contract test
    performance: Load/performance test
    slow: Slow running test
    smoke: Smoke test (quick health checks)
    regression: Regression test
asyncio_mode = auto
